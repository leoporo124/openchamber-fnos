name: 构建与发布 OpenChamber FPK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 发布到 GitHub Releases
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  package:
    name: 构建 x86_64 安装包
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 构建安装包
        run: bash build.sh
      - name: 运行前端测试
        run: npm test --prefix frontend
      - name: 运行 Go 测试
        run: go test ./...
      - name: 读取版本并生成校验文件
        id: package
        run: |
          VERSION=$(awk -F= '/^[[:space:]]*version[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2}' fnpack/manifest)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp fnpack/openchamber.fpk openchamber-x86.fpk
          sha256sum openchamber-x86.fpk > SHA256SUMS
      - name: 上传构建产物
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-x86_64
          path: |
            openchamber-x86.fpk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: 发布 GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，请提升 manifest 版本后发布。"
            exit 1
          fi
          gh release create "$TAG" openchamber-x86.fpk SHA256SUMS \
            --target "$GITHUB_SHA" --title "OpenChamber fnOS $TAG" \
            --generate-notes --notes "fnOS x86_64 原生安装包。需要 nodejs_v24，首次使用需联网部署。" --latest
