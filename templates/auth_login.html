<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenChamber · 访问验证</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fdfcfa; --card: #f7f6f4; --input: #f3f2f0;
      --text: #44443d; --muted: #696960; --border: #e5e1debf;
      --primary: #b35017; --hover: #9a4310; --active: #85390c;
      --tint: #f3e9e3; --disabled: #cbc7c2; --error: #b7493f; --error-bg: #f9ebe8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #120f0e; --card: #1b1918; --input: #171616;
        --text: #dbd7cc; --muted: #89867c; --border: #302e2b;
        --primary: #da7c47; --hover: #eb8c57; --active: #fd9b66;
        --tint: #2d1c12; --disabled: #504e4c; --error: #da5b4a; --error-bg: #301b17;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--background); color: var(--text); padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .card { background: var(--card); border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 350px; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0,0,0,.03); }
    .logo-wrap { width: 48px; height: 48px; background: var(--tint); color: var(--primary); border-radius: 14px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .logo-wrap svg { width: 30px; height: 30px; }
    h1 { text-align: center; font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--input); color: var(--text); }
    input:focus { border-color: var(--primary); background: var(--background); }
    input:disabled { color: var(--disabled); cursor: not-allowed; }
    button { width: 100%; margin-top: 12px; padding: 9px 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:active:not(:disabled) { background: var(--active); }
    button:disabled { background: var(--disabled); cursor: not-allowed; opacity: .8; }
    .err { margin-top: 12px; font-size: 12px; color: var(--error); background: var(--error-bg); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.4; }
    .spinner { width: 13px; height: 13px; border: 2px solid #ffffff4d; border-radius: 50%; border-top-color: #fff; animation: spin .6s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M16 2.5 28.5 9.375V23L16 30 3.5 23V9.375Z"/><path d="m3.5 9.375 12.5 6.875 12.5-6.875M16 16.25V30"/>
      </svg>
    </div>
    <h1>访问验证</h1>
    <p class="sub">OpenChamber</p>
    <form id="authForm" action="{{.AuthLoginPath}}" method="post" data-action="{{.AuthLoginPath}}">
      <input type="password" id="pwdInput" name="password" placeholder="请输入访问密码" aria-label="访问密码" autofocus autocomplete="current-password" {{if .IsLocked}}disabled{{end}}>
      <button type="submit" id="submitBtn" {{if .IsLocked}}disabled{{end}}><span class="spinner" id="spinner"></span><span id="btnText">{{.ButtonText}}</span></button>
    </form>
    <div id="errContainer" role="alert">{{if .ErrorHTML}}{{.ErrorHTML}}{{end}}</div>
  </div>
  <script>
    const form = document.getElementById('authForm');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('pwdInput');
      const button = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const label = document.getElementById('btnText');
      const errors = document.getElementById('errContainer');
      if (!input.value) { input.focus(); return; }
      const password = input.value;
      button.disabled = input.disabled = true;
      spinner.style.display = 'inline-block';
      label.textContent = '验证中…';
      try {
        const response = await fetch(form.dataset.action, {
          method: 'POST', credentials: 'same-origin', cache: 'no-store',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await response.json();
        if (response.ok && data.code === 0) {
          const redirect = new URL(data.redirect, location.origin);
          if (redirect.origin !== location.origin) throw new Error('返回地址无效');
          label.textContent = '验证成功';
          location.replace(redirect.href);
          return;
        }
        showError(data.message || '密码验证失败，请重试');
        button.disabled = input.disabled = Boolean(data.locked);
        label.textContent = data.locked ? '已锁定冷却中' : '进入';
        if (!data.locked) { input.focus(); input.select(); }
      } catch {
        showError('验证请求失败，请刷新页面后重试');
        button.disabled = input.disabled = false;
        label.textContent = '进入';
      } finally {
        spinner.style.display = 'none';
      }
      function showError(message) {
        const box = document.createElement('div');
        box.className = 'err';
        box.textContent = message;
        errors.replaceChildren(box);
      }
    });
  </script>
</body>
</html>
