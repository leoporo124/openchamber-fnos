<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenChamber · 状态提示</title>
  <style>
    :root { color-scheme: light dark; --background: #fdfcfa; --card: #f7f6f4; --text: #44443d; --muted: #696960; --border: #e5e1debf; --primary: #b35017; --hover: #9a4310; --active: #85390c; --tint: #f3e9e3; --error: #b7493f; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #120f0e; --card: #1b1918; --text: #dbd7cc; --muted: #89867c; --border: #302e2b; --primary: #da7c47; --hover: #eb8c57; --active: #fd9b66; --tint: #2d1c12; --error: #da5b4a; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--background); color: var(--text); padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .card { background: var(--card); border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0,0,0,.03); text-align: center; }
    .logo-wrap { width: 52px; height: 52px; background: var(--tint); color: var(--primary); border-radius: 14px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .logo-wrap svg { width: 32px; height: 32px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; margin-bottom: 10px; border: 1px solid var(--border); }
    .badge-starting { background: var(--tint); color: var(--primary); }
    .badge-stopped { color: var(--muted); }
    .badge-err { color: var(--error); }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
    .auto-retry { font-size: 12px; color: var(--primary); background: var(--tint); padding: 7px 10px; border-radius: 8px; margin-bottom: 14px; }
    .btn { width: 100%; padding: 9px 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .btn:hover { background: var(--hover); }
    .btn:active { background: var(--active); }
    .details-box { margin-top: 14px; text-align: left; }
    .details-box pre { padding: 8px 10px; background: var(--background); border: 1px solid var(--border); border-radius: 6px; font-family: monospace; font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="card" id="statusCard" data-starting="{{if .IsStarting}}true{{else}}false{{end}}">
    <div class="logo-wrap"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16 2.5 28.5 9.375V23L16 30 3.5 23V9.375Z"/><path d="m3.5 9.375 12.5 6.875 12.5-6.875M16 16.25V30"/></svg></div>
    <div class="badge {{.BadgeClass}}">{{.BadgeText}}</div>
    <h1>{{.Title}}</h1>
    <p class="desc">{{.Desc}}</p>
    {{if .IsStarting}}<div class="auto-retry">正在探测服务状态，将在 <b id="countdown">3</b> 秒后重试</div>{{end}}
    <button class="btn" onclick="location.reload()">立即刷新</button>
    {{if .DetailsHTML}}{{.DetailsHTML}}{{end}}
  </div>
  <script>
    const card = document.getElementById('statusCard');
    if (card.dataset.starting === 'true') {
      let countdown = 3;
      const label = document.getElementById('countdown');
      setInterval(async () => {
        if (--countdown > 0) { label.textContent = countdown; return; }
        countdown = 3;
        label.textContent = countdown;
        try {
          const response = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
          if (response.status < 500) location.reload();
        } catch {}
      }, 1000);
    }
  </script>
</body>
</html>
